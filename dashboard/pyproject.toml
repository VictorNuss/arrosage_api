[project]
name = "arrosage-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dash==2.18.2",
    "dash-bootstrap-components==1.6.0",
    "plotly==5.24.1",
    "pandas==2.2.3",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "paho-mqtt==2.1.0",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
