listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Accès anonyme activé par défaut (réseau local de confiance uniquement).
# Pour sécuriser : commenter la ligne ci-dessous, générer un fichier de mots
# de passe avec `mosquitto_passwd -c /mosquitto/config/passwd <utilisateur>`,
# et décommenter `password_file`.
allow_anonymous true
# password_file /mosquitto/config/passwd
